services:
  - type: web
    name: thiqah-staging-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/phase2-connected-staging
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: CORE_STAGING_MODE
        value: "true"
      - key: DATABASE_MODE
        value: url
      - key: DB_POOL_MAX
        value: "5"
      - key: REDIS_MODE
        value: tcp
      - key: STORAGE_PROVIDER
        value: r2
      - key: OTP_PROVIDER
        value: unifonic
      - key: EMAIL_PROVIDER
        value: resend
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: PUBLIC_APP_ORIGINS
        value: https://thiqah-staging-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Fail-closed core-staging sentinels. These are never used while
      # CORE_STAGING_MODE=true. Replace with real credentials, then set
      # CORE_STAGING_MODE=false to activate the full dependency set.
      - key: R2_ACCOUNT_ID
        value: not-configured
      - key: R2_BUCKET
        value: not-configured
      - key: R2_ACCESS_KEY_ID
        value: not-configured
      - key: R2_SECRET_ACCESS_KEY
        value: not-configured
      - key: UNIFONIC_APPSID
        value: not-configured
      - key: SMS_SENDER_ID
        value: THIQAH
      - key: RESEND_API_KEY
        value: not-configured
      - key: SUPPORT_FROM_EMAIL
        value: staging-disabled@invalid.example
      - key: SESSION_HMAC_KEY
        generateValue: true
      - key: PII_HASH_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY_BASE64
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY_BASE64
        generateValue: true

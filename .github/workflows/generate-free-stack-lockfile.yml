name: Generate Free Stack Lockfile Once

on:
  push:
    branches: [feat/phase2-connected-staging]
    paths:
      - 'package.json'
      - '.github/workflows/generate-free-stack-lockfile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/phase2-connected-staging
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install and tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name 'Eslam Elshikh'
          git config user.email 'moqawel1215@gmail.com'
          rm .github/workflows/generate-free-stack-lockfile.yml
          git add package-lock.json .github/workflows/generate-free-stack-lockfile.yml
          git commit -m 'build: refresh lockfile for R2 free stack'
          git push origin HEAD:feat/phase2-connected-staging

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      source_present: ${{ steps.source.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Detect application source
        id: source
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Source-gated baseline detected; application checks are intentionally skipped."
          fi

      - name: Require committed lockfile
        if: steps.source.outputs.present == 'true'
        run: test -f package-lock.json || (echo 'package-lock.json must be generated and committed before merge' && exit 1)

      - name: Setup Node.js
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.source.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run application checks
        if: steps.source.outputs.present == 'true'
        run: npm run check

      - name: Validate source-gated baseline
        if: steps.source.outputs.present != 'true'
        run: |
          test -f README.md
          test -f .gitignore

  container:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.source_present == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: thiqah-api:ci
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

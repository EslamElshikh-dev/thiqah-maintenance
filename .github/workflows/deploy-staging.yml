name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'scripts/**'
      - 'infra/gcp/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-staging.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: thiqah-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_MIGRATOR_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATOR_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_NETWORK: ${{ vars.GCP_NETWORK }}
      GCP_SUBNETWORK: ${{ vars.GCP_SUBNETWORK }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      RUNTIME_IAM_DB_USER: ${{ vars.RUNTIME_IAM_DB_USER }}
      MIGRATOR_IAM_DB_USER: ${{ vars.MIGRATOR_IAM_DB_USER }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      STAGING_PUBLIC_APP_ORIGINS: ${{ vars.STAGING_PUBLIC_APP_ORIGINS }}
      SMS_WEBHOOK_URL: ${{ vars.SMS_WEBHOOK_URL }}
      EMAIL_WEBHOOK_URL: ${{ vars.EMAIL_WEBHOOK_URL }}
      SUPPORT_FROM_EMAIL: ${{ vars.SUPPORT_FROM_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require committed lockfile
        run: test -f package-lock.json || (echo 'package-lock.json must be generated and committed before staging deploy' && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run verify:staging

      - name: Authenticate to Google Cloud using OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable API image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Release database and deploy staging
        env:
          GCP_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/api@${{ steps.build.outputs.digest }}
        run: scripts/gcp/deploy-staging.sh

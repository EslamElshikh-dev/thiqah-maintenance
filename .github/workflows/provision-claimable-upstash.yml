name: Provision Claimable Upstash Staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-claimable-upstash.yml

permissions:
  contents: read

concurrency:
  group: thiqah-claimable-upstash-staging
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'EslamElshikh-dev/thiqah-maintenance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/phase2-connected-staging

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Provision, validate with application adapter, and encrypt handoff
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          RESPONSE_FILE="$(mktemp)"
          curl --fail --silent --show-error \
            -X POST https://upstash.com/start-redis \
            -H 'User-Agent: openai-codex' \
            > "$RESPONSE_FILE"

          ENDPOINT="$(sed -n 's/^Endpoint:[[:space:]]*//p' "$RESPONSE_FILE" | head -n1)"
          TOKEN="$(sed -n 's/^Token:[[:space:]]*//p' "$RESPONSE_FILE" | head -n1)"
          case "$ENDPOINT" in
            https://*.upstash.io) ;;
            *) echo 'Upstash returned an invalid REST endpoint' >&2; exit 1 ;;
          esac
          if [ "${#TOKEN}" -lt 20 ]; then
            echo 'Upstash returned an invalid REST token' >&2
            exit 1
          fi

          echo "::add-mask::$ENDPOINT"
          echo "::add-mask::$TOKEN"
          export UPSTASH_REDIS_REST_URL="$ENDPOINT"
          export UPSTASH_REDIS_REST_TOKEN="$TOKEN"

          node --input-type=module <<'NODE'
          import { createUpstashRestRedis } from './apps/api/src/plugins/upstash-rest-rate-limit.js';

          const config = {
            upstashRedisRestUrl: process.env.UPSTASH_REDIS_REST_URL,
            upstashRedisRestToken: process.env.UPSTASH_REDIS_REST_TOKEN
          };
          const redis = createUpstashRestRedis(config);
          if (await redis.ping() !== 'PONG') throw new Error('Upstash PING verification failed');

          const Store = redis.rateLimitStore;
          const store = new Store({ max: 3, continueExceeding: false, exponentialBackoff: false });
          const key = `gha-${Date.now()}`;
          const invoke = (method) => new Promise((resolve, reject) => {
            store[method](key, (error, value) => error ? reject(error) : resolve(value), 60_000, 3);
          });

          const first = await invoke('incr');
          const snapshot = await invoke('read');
          const second = await invoke('incr');
          if (first.current !== 1 || snapshot.current !== 1 || second.current !== 2) {
            throw new Error('Upstash rate-limit counter verification failed');
          }
          if (first.ttl <= 0 || snapshot.ttl <= 0 || second.ttl <= 0) {
            throw new Error('Upstash rate-limit TTL verification failed');
          }

          const cleanup = await fetch(config.upstashRedisRestUrl, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${config.upstashRedisRestToken}`,
              'content-type': 'application/json'
            },
            body: JSON.stringify(['DEL', `thiqah:ratelimit:${key}`]),
            signal: AbortSignal.timeout(5_000)
          });
          if (!cleanup.ok) throw new Error('Upstash cleanup failed');
          console.log('Upstash REST live validation passed: PING + atomic counter + TTL + read + cleanup.');
          NODE

          cp "$RESPONSE_FILE" /tmp/thiqah-upstash-handoff.txt
          cat > /tmp/thiqah-upstash-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAw8jsg70Ve9zpY6uQkmPp
          Ymv5CI2kzjoqnWz8YuTBXnn1mwsl21u2e3QbaofORUhdLD01Zg+83scLCM4mmoef
          YsSjKRhESuSb1+GMhavHO6sYznHwnRkP9DSyxnCFRJeHTKIw22qjdazArGq1/azB
          7xR8UXhW6T0uxF1HFO/nioX5cvzizs95leEwORFp17kMyU9EWveD9mMrzcoGmMzp
          BFnWRGu3CGEAUqjKgLkOe8hmpRY2eZz2UnBo3vvpo44Mzqi2UzJKMMZhDHJb0DXL
          uHqjY2ZeZWxCQZfWbWKwFtifr2tlMgS8K++L5v8Avg0PRywFtdSPUJ1IAqPkK2Mq
          4pzI1kid5lYKU4eq/gCnfb6JDiOpg+tfqX72XMsJG8QGJFQoo1T2rVWlv5qkUCI1
          11fVtCtzcE+FQOb8sIZs/hizASRZ9IwBfZQGPba4rLyN7WHsVyFLLzd1tktZpldT
          mnbtRQzimC3m8mTYNppNwTQW6rwbYP3wHZzVaZgxUg4lAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY

          openssl rand 32 > /tmp/thiqah-upstash-aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/thiqah-upstash-handoff.txt \
            -out /tmp/thiqah-upstash-handoff.enc \
            -pass file:/tmp/thiqah-upstash-aes.key
          openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/thiqah-upstash-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/thiqah-upstash-aes.key \
            -out /tmp/thiqah-upstash-aes.key.enc

          sha256sum /tmp/thiqah-upstash-handoff.enc /tmp/thiqah-upstash-aes.key.enc > /tmp/SHA256SUMS
          rm -f "$RESPONSE_FILE" /tmp/thiqah-upstash-handoff.txt /tmp/thiqah-upstash-aes.key /tmp/thiqah-upstash-public.pem

      - name: Upload encrypted Upstash handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thiqah-upstash-claimable-handoff
          path: |
            /tmp/thiqah-upstash-handoff.enc
            /tmp/thiqah-upstash-aes.key.enc
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

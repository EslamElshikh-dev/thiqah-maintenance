name: Bootstrap Cloudflare R2 Broker (one-shot)

# One-shot bootstrap. Delete after the broker is deployed and verified.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-r2-device.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_EMAIL: moqawel1215@gmail.com
      EXPECTED_ACCOUNT_ID: 79f5d5c07f586845c3ab35147edb7a6b
      R2_BUCKET: thiqah-staging-private-media
      WORKER_NAME: thiqah-staging-r2-broker
      PREFERRED_WORKERS_SUBDOMAIN: thiqah-eslam-79f5d5c0
      WRANGLER_SEND_METRICS: "false"
      PUBLIC_KEY_B64: 

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/phase2-connected-staging

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install --global wrangler@4.129.0

      - name: Authorize Cloudflare, deploy broker, and smoke-test R2
        shell: bash
        run: |
          set -euo pipefail
          echo "$PUBLIC_KEY_B64" | base64 -d > public.pem

          echo "Starting Cloudflare device authorization."
          echo "Verification page: https://dash.cloudflare.com/oauth2/device"
          wrangler login --device --browser=false

          AUTH_JSON="$(wrangler auth token --json)"
          CF_TOKEN="$(printf '%s' "$AUTH_JSON" | jq -r '.token')"
          test -n "$CF_TOKEN" && test "$CF_TOKEN" != "null"

          curl -fsS https://api.cloudflare.com/client/v4/user \
            -H "Authorization: Bearer $CF_TOKEN" > user.json
          EMAIL="$(jq -r '.result.email // empty' user.json)"
          if [ "$EMAIL" != "$EXPECTED_EMAIL" ]; then
            echo "Authenticated Cloudflare email does not match the expected account. Aborting safely."
            exit 21
          fi

          curl -fsS 'https://api.cloudflare.com/client/v4/accounts?per_page=50' \
            -H "Authorization: Bearer $CF_TOKEN" > accounts.json
          ACCOUNT_ID="$(jq -r '.result[0].id // empty' accounts.json)"
          if [ "$ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "Authenticated Cloudflare account does not match the locked staging account. Aborting safely."
            exit 22
          fi

          wrangler r2 bucket list | grep -F "$R2_BUCKET" >/dev/null
          wrangler r2 bucket dev-url disable "$R2_BUCKET" --force || true

          curl -sS "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" > subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' subdomain.json)"
          if [ -z "$SUBDOMAIN" ]; then
            jq -n --arg subdomain "$PREFERRED_WORKERS_SUBDOMAIN" '{subdomain:$subdomain}' > subdomain-request.json
            curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/subdomain" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @subdomain-request.json > subdomain.json
            SUBDOMAIN="$(jq -r '.result.subdomain // empty' subdomain.json)"
          fi
          test -n "$SUBDOMAIN"

          HMAC_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          wrangler deploy --config cloudflare/r2-worker/wrangler.jsonc
          printf '%s' "$HMAC_KEY" | wrangler secret put STORAGE_HMAC_KEY --config cloudflare/r2-worker/wrangler.jsonc

          jq -n '{enabled:true,previews_enabled:false}' > worker-subdomain.json
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @worker-subdomain.json >/dev/null

          WORKER_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${WORKER_URL}/health" >/dev/null; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "R2 broker health check failed"; exit 23; fi
            sleep 3
          done

          export HMAC_KEY WORKER_URL
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          const base = process.env.WORKER_URL;
          const secret = process.env.HMAC_KEY;
          const key = `staging-smoke/${process.env.GITHUB_RUN_ID || Date.now()}.txt`;
          const body = 'thiqah-r2-broker-smoke';
          const canonical = (method, exp, ct = '', disp = '', size = '') => [method, key, String(exp), ct, disp, String(size)].join('\n');
          const signed = (method, { ct = '', disp = '', size = '' } = {}) => {
            const exp = Math.floor(Date.now() / 1000) + 120;
            const sig = createHmac('sha256', secret).update(canonical(method, exp, ct, disp, size)).digest('base64url');
            const url = new URL(`${base}/v1/object/${encodeURIComponent(key)}`);
            url.searchParams.set('exp', String(exp));
            url.searchParams.set('sig', sig);
            if (ct) url.searchParams.set('ct', ct);
            if (disp) url.searchParams.set('disp', disp);
            if (size !== '') url.searchParams.set('size', String(size));
            return url;
          };

          const put = await fetch(signed('PUT', { ct: 'text/plain', size: Buffer.byteLength(body) }), {
            method: 'PUT',
            headers: { 'content-type': 'text/plain', 'if-none-match': '*' },
            body
          });
          if (put.status !== 201) throw new Error(`PUT smoke failed: ${put.status}`);

          const head = await fetch(signed('HEAD'), { method: 'HEAD' });
          if (!head.ok || Number(head.headers.get('content-length')) !== Buffer.byteLength(body)) throw new Error(`HEAD smoke failed: ${head.status}`);

          const get = await fetch(signed('GET'));
          if (!get.ok || await get.text() !== body) throw new Error(`GET smoke failed: ${get.status}`);

          const del = await fetch(signed('DELETE'), { method: 'DELETE' });
          if (del.status !== 204) throw new Error(`DELETE smoke failed: ${del.status}`);

          const missing = await fetch(signed('HEAD'), { method: 'HEAD' });
          if (missing.status !== 404) throw new Error(`DELETE verification failed: ${missing.status}`);
          console.log('R2 broker smoke lifecycle: PASS');
          NODE

          seal() {
            printf '%s' "$1" | openssl pkeyutl -encrypt -pubin -inkey public.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
          }

          echo "R2_BROKER_URL=${WORKER_URL}"
          echo "R2_BROKER_HMAC_SEALED=$(seal "$HMAC_KEY")"
          echo "R2_BROKER_COMPLETE=true"

          rm -f public.pem user.json accounts.json subdomain.json subdomain-request.json worker-subdomain.json
          unset HMAC_KEY CF_TOKEN
          wrangler logout || true

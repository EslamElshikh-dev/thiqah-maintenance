name: Migrate Free Staging Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE to run checksum-verified migrations against Neon staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thiqah-free-staging-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    environment: free-staging-db
    env:
      NODE_ENV: production
      APP_ENV: staging
      DATABASE_MODE: url
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_ADMIN }}
      DB_POOL_MAX: '1'
    steps:
      - name: Checkout reviewed staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/phase2-connected-staging

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run checksum-verified migrations
        run: npm run migrate

      - name: Provision and verify least-privilege Neon runtime role
        env:
          NEON_DATABASE_URL_ADMIN: ${{ secrets.NEON_DATABASE_URL_ADMIN }}
          NEON_RUNTIME_DB_PASSWORD: ${{ secrets.NEON_RUNTIME_DB_PASSWORD }}
        run: npm run provision:neon-runtime

      - name: Verify schema readiness
        run: node scripts/check-free-staging-db.mjs
